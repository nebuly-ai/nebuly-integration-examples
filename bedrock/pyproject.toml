[tool.poetry]
name = "bedrock"
version = "0.1.0"
description = "AWS Bedrock integration"
authors = ["The Nebuly Team"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4"
boto3 = "^1.35"
httpx = "^0.28.0"
python-dotenv = "^1.0.0"
tenacity = "^9.0.0"
tqdm = "^4.67"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pre-commit = "^4.6.0"
ruff = "^0.15.0"
mypy = "^1.20.0"
boto3-stubs = { extras = ["s3", "sts"], version = "^1.35" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
# Same settings as the repo root, without the pydantic plugin: this package
# does not use pydantic, and mypy would otherwise pick up the root config.
strict = true
disallow_untyped_defs = true
