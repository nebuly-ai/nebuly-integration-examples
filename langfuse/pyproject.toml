[tool.poetry]
name = "langfuse-nebuly"
version = "0.1.0"
description = "Fetch Langfuse traces and send them to Nebuly event ingestion"
authors = ["The Nebuly Team"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4"
requests = "^2.32.0"
python-dotenv = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
