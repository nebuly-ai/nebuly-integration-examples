[tool.poetry]
name = "langfuse-nebuly"
version = "0.1.0"
description = "Incrementally sync Langfuse traces to Nebuly event ingestion"
authors = ["The Nebuly Team"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4"
httpx = "^0.28.0"
python-dotenv = "^1.0.0"
tenacity = "^9.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pre-commit = "^4.6.0"
ruff = "^0.15.0"
mypy = "^1.20.0"
pydantic = "^2.0"

[tool.poetry.group.dev]
optional = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
